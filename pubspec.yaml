name: sa_town_names
description: "Then & Now: SA Town Names - old and new South African town names on one map."
publish_to: 'none'
version: 1.0.2+5

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'      # required by flutter_map 8

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.2.2          # Map tiles, pan & zoom, markers, built-in tile cache
  latlong2: ^0.9.1             # LatLng type used by flutter_map
  sqflite: ^2.3.3              # Local on-device SQLite database
  path: ^1.9.0
  path_provider: ^2.1.3
  flutter_map_marker_cluster: ^8.2.2  # Clusters markers when zoomed out (matches flutter_map 8)
  in_app_purchase: ^3.2.0      # StoreKit / Play Billing purchase flow
  shared_preferences: ^2.3.2   # Caches local "purchased" flag
  url_launcher: ^6.3.1         # Opens credit/licence links in the browser
  geolocator: ^14.0.0          # One-off location for "Where am I?"
  share_plus: '>=11.1.0 <14.0.0'  # Share "Then -> Now" cards (WhatsApp etc.)
  in_app_update: '>=4.2.5 <5.0.0'  # Offers new Google Play versions inside the app
  http: ^1.2.0                 # Downloads live town-name updates
  flutter_map_mbtiles: ^1.0.4  # Offline Maps add-on: reads downloaded map packs

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4  # Makes the app icon in every size: dart run flutter_launcher_icons

flutter:
  uses-material-design: true
  assets:
    - assets/towns.json
    - assets/name_stories.json
    - assets/place_facts.json
    - assets/dam_stations.json
    - assets/sa_outline.json
    - assets/icon/app_icon.png

# App icon (the Then/Now pin). After changing the images in assets/icon/,
# run `dart run flutter_launcher_icons` to regenerate the Android and iOS icons.
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#F6EFE3"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  ios: true
  remove_alpha_ios: true
