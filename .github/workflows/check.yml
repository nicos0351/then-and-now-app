name: Check the app

# Runs on every push: the same checks as `flutter analyze` and `flutter test`
# on your PC, so mistakes are caught before a zip is sent. Nothing is built
# or published, and no keys are needed.

on:
  push:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        # On failure, the details also go into one annotation (readable
        # through the GitHub API without downloading the log).
        run: |
          set -o pipefail
          if ! flutter test --reporter expanded 2>&1 | tee test-output.txt; then
            msg=$(awk '!/^[0-9][0-9]:[0-9][0-9] / || /\[E\]/' test-output.txt | tail -c 30000 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Tests failed::$msg"
            exit 1
          fi
